<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kids Time Tracker</title>
<style>
/* ── Tokens ── */
:root {
  --bg:        #0f1117;
  --surface:   #181c26;
  --surface2:  #1f2535;
  --border:    #2a3045;
  --text:      #e4e8f0;
  --text-dim:  #7a85a0;
  --text-xdim: #3e4a63;
  --c-dad:     #4a9eff;
  --c-mom:     #ff7eb3;
  --c-gp:      #a78bfa;
  --c-dad-hol: #34d399;
  --c-mom-hol: #fb923c;
  --c-dad-hkids:#22d3ee;
  --c-mom-hkids:#f472b6;
  --c-together:#fbbf24;
  --radius: 10px;
  --tab-h: 48px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  font-size: 14px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ══ AUTH SCREEN ══ */
#authScreen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  width: 100%;
  padding: 24px;
}
.auth-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 36px 32px;
  width: 100%;
  max-width: 380px;
}
.auth-logo {
  font-size: 28px;
  font-weight: 800;
  text-align: center;
  margin-bottom: 6px;
  letter-spacing: -0.5px;
}
.auth-logo span { color: var(--c-together); }
.auth-sub {
  text-align: center;
  font-size: 13px;
  color: var(--text-dim);
  margin-bottom: 28px;
}
.auth-tabs {
  display: flex;
  background: var(--surface);
  border-radius: 8px;
  padding: 3px;
  margin-bottom: 24px;
  gap: 3px;
}
.auth-tab {
  flex: 1;
  padding: 8px;
  border: none;
  border-radius: 6px;
  background: transparent;
  color: var(--text-dim);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s, color .15s;
}
.auth-tab.active {
  background: var(--surface2);
  color: var(--text);
}
.auth-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 14px;
}
.auth-field label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: .3px;
}
.auth-field input {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  color: var(--text);
  font-size: 14px;
  outline: none;
  transition: border-color .15s;
}
.auth-field input:focus { border-color: var(--c-together); }
.auth-error {
  font-size: 12px;
  color: #ef4444;
  min-height: 18px;
  margin-bottom: 6px;
}
.auth-submit {
  width: 100%;
  padding: 11px;
  background: var(--c-together);
  border: none;
  border-radius: 8px;
  color: #000;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 4px;
  transition: opacity .15s;
}
.auth-submit:hover { opacity: .88; }

/* ══ APP SHELL ══ */
#appShell { display: none; flex-direction: column; align-items: center; width: 100%; }

/* ── Header ── */
header {
  width: 100%;
  max-width: 1100px;
  padding: 22px 24px 0;
  display: flex;
  align-items: center;
  gap: 12px;
}
header h1 {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.3px;
  flex: 1;
}
header h1 span { color: var(--c-together); }
.user-bar {
  display: flex;
  align-items: center;
  gap: 10px;
}
.user-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
  font-weight: 700;
  color: #000;
  flex-shrink: 0;
}
.user-name { font-size: 13px; color: var(--text-dim); }
.btn-signout {
  padding: 5px 12px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  font-size: 12px;
  cursor: pointer;
  transition: color .15s;
}
.btn-signout:hover { color: var(--text); }

/* ── Tabs ── */
.tabs {
  width: 100%;
  max-width: 1100px;
  padding: 18px 24px 0;
  display: flex;
  gap: 4px;
}
.tab-btn {
  height: var(--tab-h);
  padding: 0 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-bottom: none;
  border-radius: var(--radius) var(--radius) 0 0;
  color: var(--text-dim);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: color .15s, background .15s;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { background: var(--surface2); color: var(--text); }

/* ── Main panel ── */
.panel-wrap {
  width: 100%;
  max-width: 1100px;
  padding: 0 24px 40px;
}
.panel {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 0 var(--radius) var(--radius) var(--radius);
  padding: 28px;
  display: none;
}
.panel.active { display: block; }

/* ── Calendar ── */
.cal-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 20px;
}
.cal-header h2 { font-size: 18px; font-weight: 700; flex: 1; }
.cal-nav {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 6px;
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 16px;
  transition: background .15s;
}
.cal-nav:hover { background: var(--border); }
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}
.cal-dow {
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-dim);
  letter-spacing: .5px;
  padding: 6px 0;
  text-transform: uppercase;
}
.cal-day {
  aspect-ratio: 1;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  background: var(--surface);
  border: 2px solid transparent;
  transition: border-color .12s, transform .1s;
  position: relative;
  gap: 2px;
  padding: 2px;
  min-height: 52px;
  user-select: none;
}
.cal-day:hover { border-color: var(--border); transform: scale(1.04); }
.cal-day.empty { cursor: default; background: transparent; }
.cal-day.empty:hover { transform: none; border-color: transparent; }
.cal-day.selected { border-color: var(--c-together) !important; box-shadow: 0 0 0 2px rgba(251,191,36,.25); }
.cal-day .day-num { font-size: 13px; font-weight: 600; line-height: 1; }
.cal-day.other-month .day-num { color: var(--text-xdim); }
.day-chips { display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; }
.chip { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.cal-day.today .day-num {
  background: var(--c-together);
  color: #000;
  width: 22px; height: 22px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
}

/* ── Legend ── */
.legend { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); }
.legend-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }

/* ── Selection toolbar ── */
.sel-toolbar {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 20px;
  margin-top: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
}
.sel-toolbar .sel-info { font-size: 13px; color: var(--text-dim); }
.sel-toolbar .sel-info strong { color: var(--text); }
.sel-hint { font-size: 12px; color: var(--text-xdim); margin-left: 6px; }
.sel-actions { display: flex; gap: 8px; }
.btn-ghost {
  padding: 6px 14px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  font-size: 12px;
  cursor: pointer;
  transition: color .15s, border-color .15s;
}
.btn-ghost:hover { color: var(--text); border-color: var(--text-dim); }
.btn-danger {
  padding: 6px 14px;
  border-radius: 6px;
  border: 1px solid #ef4444;
  background: transparent;
  color: #ef4444;
  font-size: 12px;
  cursor: pointer;
}
.btn-danger:hover { background: rgba(239,68,68,.1); }

/* ── Report ── */
.report-controls {
  display: flex;
  gap: 12px;
  align-items: center;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.report-controls label { font-size: 13px; color: var(--text-dim); }
.report-controls select,
.report-controls input[type="number"] {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 13px;
  outline: none;
}
.report-controls select:focus,
.report-controls input:focus { border-color: var(--c-together); }
.report-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}
.report-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
}
.report-card .rc-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .5px;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 7px;
}
.rc-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.report-card .rc-days { font-size: 32px; font-weight: 800; line-height: 1; margin-bottom: 4px; }
.report-card .rc-unit { font-size: 13px; color: var(--text-dim); }
.report-card .rc-periods {
  margin-top: 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-height: 130px;
  overflow-y: auto;
}
.rc-period-row {
  font-size: 12px;
  color: var(--text-dim);
  padding: 4px 8px;
  background: var(--surface2);
  border-radius: 5px;
  display: flex;
  justify-content: space-between;
}
.rc-period-row span { color: var(--text); font-weight: 600; }

/* ── History ── */
.hist-controls {
  display: flex;
  gap: 12px;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.hist-controls label { font-size: 13px; color: var(--text-dim); }
.hist-controls select,
.hist-controls input[type="number"] {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 13px;
  outline: none;
}
.hist-controls select:focus { border-color: var(--c-together); }
.hist-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.hist-entry {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 16px;
  display: grid;
  grid-template-columns: 28px 1fr auto;
  align-items: center;
  gap: 12px;
}
.hist-avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
  font-weight: 700;
  color: #000;
  flex-shrink: 0;
}
.hist-body { display: flex; flex-direction: column; gap: 3px; }
.hist-action { font-size: 13px; color: var(--text); }
.hist-action .hist-type-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 1px 7px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 700;
  color: #000;
  margin: 0 2px;
}
.hist-meta { font-size: 11px; color: var(--text-dim); }
.hist-time { font-size: 12px; color: var(--text-xdim); white-space: nowrap; }
.hist-badge-add    { background: #34d39920; border: 1px solid #34d39950; color: #34d399; border-radius: 4px; padding: 2px 7px; font-size: 11px; font-weight: 700; }
.hist-badge-remove { background: #ef444420; border: 1px solid #ef444450; color: #ef4444; border-radius: 4px; padding: 2px 7px; font-size: 11px; font-weight: 700; }
.hist-badge-clear  { background: #7a85a020; border: 1px solid #7a85a050; color: #7a85a0; border-radius: 4px; padding: 2px 7px; font-size: 11px; font-weight: 700; }

/* Empty state */
.empty-state { text-align: center; padding: 48px 0; color: var(--text-dim); }
.empty-state .es-icon { font-size: 36px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; }

/* ── Context menu ── */
#ctxMenu {
  position: fixed;
  z-index: 1000;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 6px;
  min-width: 230px;
  box-shadow: 0 8px 32px rgba(0,0,0,.5);
  display: none;
}
#ctxMenu.visible { display: block; }
.ctx-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .5px;
  text-transform: uppercase;
  color: var(--text-dim);
  padding: 4px 8px 8px;
}
.ctx-section-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .5px;
  text-transform: uppercase;
  color: var(--text-xdim);
  padding: 6px 8px 2px;
}
.ctx-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 8px;
  border-radius: 6px;
  cursor: pointer;
  transition: background .12s;
}
.ctx-row:hover { background: var(--surface); }
.ctx-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.ctx-label { flex: 1; font-size: 13px; }
.ctx-remove { font-size: 14px; color: var(--text-xdim); line-height: 1; transition: color .12s; }
.ctx-row:hover .ctx-remove { color: #ef4444; }
.ctx-add-icon { font-size: 15px; color: var(--text-xdim); line-height: 1; transition: color .12s; }
.ctx-row:hover .ctx-add-icon { color: #34d399; }
.ctx-divider { border: none; border-top: 1px solid var(--border); margin: 4px 0; }
.ctx-clear {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 8px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  color: #ef4444;
  transition: background .12s;
}
.ctx-clear:hover { background: rgba(239,68,68,.1); }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--surface); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ── Responsive ── */
@media (max-width: 600px) {
  header { padding: 16px 12px 0; }
  .tabs { padding: 16px 12px 0; }
  .panel-wrap { padding: 0 12px 32px; }
  .panel { padding: 16px; }
  .tab-btn { padding: 0 12px; font-size: 12px; }
  .cal-day { min-height: 38px; }
  .report-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- ══ AUTH SCREEN ══ -->
<div id="authScreen">
  <div class="auth-card">
    <div class="auth-logo">Kids <span>✦</span> Time Tracker</div>
    <div class="auth-sub">Sign in to your family account</div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="authTabLogin">Sign in</button>
      <button class="auth-tab" id="authTabRegister">Register</button>
    </div>
    <div class="auth-field">
      <label>Username</label>
      <input type="text" id="authUsername" placeholder="e.g. dad" autocomplete="username">
    </div>
    <div class="auth-field">
      <label>Password</label>
      <input type="password" id="authPassword" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div id="authRegisterExtra" style="display:none">
      <div class="auth-field">
        <label>Display name</label>
        <input type="text" id="authDisplayName" placeholder="e.g. Dad">
      </div>
    </div>
    <div class="auth-error" id="authError"></div>
    <button class="auth-submit" id="authSubmit">Sign in</button>
  </div>
</div>

<!-- ══ APP SHELL ══ -->
<div id="appShell">

  <header>
    <h1>Kids <span>✦</span> Time Tracker</h1>
    <div class="user-bar">
      <div class="user-avatar" id="headerAvatar"></div>
      <span class="user-name" id="headerName"></span>
      <button class="btn-signout" id="signOutBtn">Sign out</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="calendar">📅 Calendar</button>
    <button class="tab-btn" data-tab="report">📊 Report</button>
    <button class="tab-btn" data-tab="history">🕓 History</button>
  </nav>

  <div class="panel-wrap">

    <!-- ══ CALENDAR ══ -->
    <section id="tab-calendar" class="panel active">
      <div class="cal-header">
        <button class="cal-nav" id="prevMonth">‹</button>
        <h2 id="calTitle"></h2>
        <button class="cal-nav" id="nextMonth">›</button>
      </div>
      <div class="legend" id="legend"></div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="sel-toolbar">
        <div class="sel-info">
          <strong id="selCount">0</strong> day<span id="selPlural">s</span> selected
          <span class="sel-hint">— right-click a day to assign or remove types</span>
        </div>
        <div class="sel-actions">
          <button class="btn-ghost" id="clearSelBtn">Deselect all</button>
          <button class="btn-danger" id="resetBtn">Reset all data</button>
        </div>
      </div>
    </section>

    <!-- ══ REPORT ══ -->
    <section id="tab-report" class="panel">
      <div class="report-controls">
        <label>Year</label>
        <input type="number" id="reportYear" min="2000" max="2100" style="width:80px">
        <label>Month</label>
        <select id="reportMonth">
          <option value="all">All months</option>
          <option value="0">January</option><option value="1">February</option>
          <option value="2">March</option><option value="3">April</option>
          <option value="4">May</option><option value="5">June</option>
          <option value="6">July</option><option value="7">August</option>
          <option value="8">September</option><option value="9">October</option>
          <option value="10">November</option><option value="11">December</option>
        </select>
      </div>
      <div class="report-grid" id="reportGrid"></div>
    </section>

    <!-- ══ HISTORY ══ -->
    <section id="tab-history" class="panel">
      <div class="hist-controls">
        <label>Filter by user</label>
        <select id="histUserFilter"><option value="all">All users</option></select>
        <label>Action</label>
        <select id="histActionFilter">
          <option value="all">All actions</option>
          <option value="add">Add</option>
          <option value="remove">Remove</option>
          <option value="clear">Clear</option>
        </select>
        <button class="btn-ghost" id="histClearBtn" style="margin-left:auto;color:#ef4444;border-color:#ef4444">Clear history</button>
      </div>
      <div class="hist-list" id="histList"></div>
    </section>

  </div>
</div>

<!-- Context menu -->
<div id="ctxMenu" role="menu" aria-label="Day options"></div>

<script>
// ══════════════════════════════════════════════════
//  CONSTANTS
// ══════════════════════════════════════════════════

const TYPES = [
  { id: 'dad',       label: 'Dad with kids',           color: '#4a9eff', emoji: '👨' },
  { id: 'mom',       label: 'Mom with kids',           color: '#ff7eb3', emoji: '👩' },
  { id: 'gp',        label: 'Grandparents with kids',  color: '#a78bfa', emoji: '👴' },
  { id: 'dad_hol',   label: 'Dad holiday (no kids)',   color: '#34d399', emoji: '🏖' },
  { id: 'mom_hol',   label: 'Mom holiday (no kids)',   color: '#fb923c', emoji: '🌴' },
  { id: 'dad_hkids', label: 'Dad holiday with kids',   color: '#22d3ee', emoji: '🎢' },
  { id: 'mom_hkids', label: 'Mom holiday with kids',   color: '#f472b6', emoji: '🎡' },
  { id: 'together',  label: 'Family / both together',  color: '#fbbf24', emoji: '👨‍👩‍👧' },
];

// Palette for user avatars
const AVATAR_COLORS = ['#4a9eff','#ff7eb3','#a78bfa','#34d399','#fb923c','#22d3ee','#f472b6','#fbbf24'];

const SK_USERS    = 'ktt_users';      // { username: { hash, displayName, color } }
const SK_DATA     = 'ktt_v2_data';   // { "YYYY-MM-DD": [typeId, ...] }
const SK_HISTORY  = 'ktt_history';   // [ histEntry, ... ]
const SK_SESSION  = 'ktt_session';   // username string

// ══════════════════════════════════════════════════
//  SIMPLE HASH (no crypto needed — local-only)
// ══════════════════════════════════════════════════

function simpleHash(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(31, h) + str.charCodeAt(i) | 0;
  }
  return h.toString(16);
}

// ══════════════════════════════════════════════════
//  AUTH STORAGE
// ══════════════════════════════════════════════════

function getUsers()   { try { return JSON.parse(localStorage.getItem(SK_USERS)) || {}; } catch { return {}; } }
function saveUsers(u) { localStorage.setItem(SK_USERS, JSON.stringify(u)); }

function getSession()      { return localStorage.getItem(SK_SESSION) || null; }
function saveSession(user) { localStorage.setItem(SK_SESSION, user); }
function clearSession()    { localStorage.removeItem(SK_SESSION); }

// ══════════════════════════════════════════════════
//  CALENDAR DATA STORAGE
// ══════════════════════════════════════════════════

let data = {};
function loadData()  { try { data = JSON.parse(localStorage.getItem(SK_DATA)) || {}; } catch { data = {}; } }
function saveData()  { localStorage.setItem(SK_DATA, JSON.stringify(data)); }

// ══════════════════════════════════════════════════
//  HISTORY STORAGE
// ══════════════════════════════════════════════════

// entry: { id, ts, username, displayName, userColor, action, typeId, dayKeys: [] }
let history = [];
function loadHistory()   { try { history = JSON.parse(localStorage.getItem(SK_HISTORY)) || []; } catch { history = []; } }
function saveHistory()   { localStorage.setItem(SK_HISTORY, JSON.stringify(history)); }

function recordHistory(action, typeId, dayKeys) {
  if (!currentUser) return;
  const users = getUsers();
  const u = users[currentUser] || {};
  history.unshift({
    id:          Date.now() + Math.random(),
    ts:          new Date().toISOString(),
    username:    currentUser,
    displayName: u.displayName || currentUser,
    userColor:   u.color || '#7a85a0',
    action,      // 'add' | 'remove' | 'clear'
    typeId,      // null for 'clear'
    dayKeys:     [...dayKeys].sort(),
  });
  // Keep last 500 entries
  if (history.length > 500) history = history.slice(0, 500);
  saveHistory();
}

// ══════════════════════════════════════════════════
//  SESSION STATE
// ══════════════════════════════════════════════════

let currentUser = null;

function initSession() {
  const saved = getSession();
  const users = getUsers();
  if (saved && users[saved]) {
    currentUser = saved;
    showApp();
  } else {
    showAuth();
  }
}

// ══════════════════════════════════════════════════
//  AUTH UI
// ══════════════════════════════════════════════════

let authMode = 'login'; // 'login' | 'register'

document.getElementById('authTabLogin').addEventListener('click', () => setAuthMode('login'));
document.getElementById('authTabRegister').addEventListener('click', () => setAuthMode('register'));

function setAuthMode(mode) {
  authMode = mode;
  document.getElementById('authTabLogin').classList.toggle('active', mode === 'login');
  document.getElementById('authTabRegister').classList.toggle('active', mode === 'register');
  document.getElementById('authRegisterExtra').style.display = mode === 'register' ? 'block' : 'none';
  document.getElementById('authSubmit').textContent = mode === 'login' ? 'Sign in' : 'Create account';
  document.getElementById('authError').textContent = '';
}

document.getElementById('authSubmit').addEventListener('click', handleAuth);
['authUsername','authPassword','authDisplayName'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') handleAuth(); });
});

function handleAuth() {
  const username    = document.getElementById('authUsername').value.trim().toLowerCase();
  const password    = document.getElementById('authPassword').value;
  const displayName = document.getElementById('authDisplayName').value.trim();
  const errEl       = document.getElementById('authError');
  errEl.textContent = '';

  if (!username) { errEl.textContent = 'Username is required.'; return; }
  if (!password) { errEl.textContent = 'Password is required.'; return; }

  const users = getUsers();

  if (authMode === 'register') {
    if (users[username]) { errEl.textContent = 'Username already taken.'; return; }
    if (password.length < 4) { errEl.textContent = 'Password must be at least 4 characters.'; return; }
    const colorIdx = Object.keys(users).length % AVATAR_COLORS.length;
    users[username] = {
      hash:        simpleHash(password),
      displayName: displayName || username,
      color:       AVATAR_COLORS[colorIdx],
    };
    saveUsers(users);
    currentUser = username;
    saveSession(username);
    showApp();
  } else {
    if (!users[username]) { errEl.textContent = 'Username not found.'; return; }
    if (users[username].hash !== simpleHash(password)) { errEl.textContent = 'Incorrect password.'; return; }
    currentUser = username;
    saveSession(username);
    showApp();
  }
}

function showAuth() {
  document.getElementById('authScreen').style.display = 'flex';
  document.getElementById('appShell').style.display = 'none';
  document.getElementById('authUsername').value = '';
  document.getElementById('authPassword').value = '';
  document.getElementById('authDisplayName').value = '';
  document.getElementById('authError').textContent = '';
  setAuthMode('login');
}

function showApp() {
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('appShell').style.display = 'flex';

  const users = getUsers();
  const u = users[currentUser] || {};
  const initials = (u.displayName || currentUser).slice(0, 2).toUpperCase();
  const color    = u.color || '#7a85a0';

  document.getElementById('headerAvatar').textContent = initials;
  document.getElementById('headerAvatar').style.background = color;
  document.getElementById('headerName').textContent = u.displayName || currentUser;

  loadData();
  loadHistory();
  renderLegend();
  renderCalendar();
  document.getElementById('reportYear').value = today.getFullYear();
}

document.getElementById('signOutBtn').addEventListener('click', () => {
  currentUser = null;
  clearSession();
  showAuth();
});

// ══════════════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════════════

const today = new Date();

function dateKey(y, m, d) {
  return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function parseKey(k) {
  const [y,m,d] = k.split('-').map(Number);
  return { y, m: m-1, d };
}
function typeById(id) { return TYPES.find(t => t.id === id); }

function contiguousPeriods(keys) {
  if (!keys.length) return [];
  const sorted = [...keys].sort();
  const periods = [];
  let start = sorted[0], prev = sorted[0];
  for (let i = 1; i < sorted.length; i++) {
    const a = new Date(prev.replace(/-/g,'/')+' 00:00');
    const b = new Date(sorted[i].replace(/-/g,'/')+' 00:00');
    if ((b - a) / 86400000 === 1) { prev = sorted[i]; }
    else { periods.push([start, prev]); start = sorted[i]; prev = sorted[i]; }
  }
  periods.push([start, prev]);
  return periods;
}

function fmtDate(k) {
  const { y, m, d } = parseKey(k);
  return new Date(y, m, d).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}

function fmtDateTime(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) +
    ' ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
}

function fmtRelative(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1)  return 'just now';
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24)  return `${hrs}h ago`;
  const days = Math.floor(hrs / 24);
  if (days < 7)  return `${days}d ago`;
  return fmtDateTime(iso);
}

//  RESET
// ══════════════════════════════════════════════════

function resetData() {
  if (confirm('Reset ALL calendar data? This cannot be undone.')) {
    data = {};
    saveData();
    selectedDays.clear();
    renderCalendar();
  }
}

// ══════════════════════════════════════════════════
//  CALENDAR STATE
// ══════════════════════════════════════════════════

let curYear  = today.getFullYear();
let curMonth = today.getMonth();

const selectedDays = new Set();
let dragStart = null;
let dragging  = false;
let dragMode  = null;

// ══════════════════════════════════════════════════
//  CONTEXT MENU
// ══════════════════════════════════════════════════

const ctxMenu = document.getElementById('ctxMenu');
let ctxKey = null;
let longPressTimer = null;

function showCtxMenu(key, x, y) {
  ctxKey = key;
  const targets = selectedDays.size && selectedDays.has(key)
    ? [...selectedDays]
    : [key];

  const { y: dy, m: dm, d: dd } = parseKey(key);
  const isBulk = targets.length > 1;
  const label = isBulk
    ? `${targets.length} days selected`
    : new Date(dy, dm, dd).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });

  const presentOnAll = TYPES.filter(t =>
    targets.every(k => (data[k] || []).includes(t.id))
  );
  const canAdd = TYPES.filter(t =>
    targets.some(k => !(data[k] || []).includes(t.id))
  );

  let html = `<div class="ctx-title">${label}</div>`;

  if (canAdd.length) {
    html += `<div class="ctx-section-label">Add</div>`;
    canAdd.forEach(t => {
      html += `<div class="ctx-row" data-action="add" data-type="${t.id}">
        <div class="ctx-dot" style="background:${t.color};box-shadow:0 0 4px ${t.color}88"></div>
        <span class="ctx-label">${t.emoji} ${t.label}</span>
        <span class="ctx-add-icon">+</span>
      </div>`;
    });
  }
  if (presentOnAll.length) {
    if (canAdd.length) html += `<hr class="ctx-divider">`;
    html += `<div class="ctx-section-label">Remove</div>`;
    presentOnAll.forEach(t => {
      html += `<div class="ctx-row" data-action="remove" data-type="${t.id}">
        <div class="ctx-dot" style="background:${t.color};box-shadow:0 0 4px ${t.color}88"></div>
        <span class="ctx-label">${t.emoji} ${t.label}</span>
        <span class="ctx-remove">✕</span>
      </div>`;
    });
    html += `<hr class="ctx-divider">
      <div class="ctx-clear" data-action="clear">✕ Clear all types</div>`;
  }
  if (!canAdd.length && !presentOnAll.length) {
    html += `<div style="padding:8px;font-size:12px;color:var(--text-dim)">No types to edit</div>`;
  }

  ctxMenu._targets = targets;
  ctxMenu.innerHTML = html;
  ctxMenu.classList.add('visible');

  const mw = 240, mh = ctxMenu.scrollHeight || 200;
  const vw = window.innerWidth, vh = window.innerHeight;
  ctxMenu.style.left = Math.min(x, vw - mw - 8) + 'px';
  ctxMenu.style.top  = Math.min(y, vh - mh - 8) + 'px';
}

function hideCtxMenu() {
  ctxMenu.classList.remove('visible');
  ctxKey = null;
}

ctxMenu.addEventListener('click', e => {
  const row = e.target.closest('[data-action]');
  if (!row) return;
  const action  = row.dataset.action;
  const typeId  = row.dataset.type || null;
  const targets = ctxMenu._targets || [];

  if (action === 'add') {
    targets.forEach(k => {
      if (!data[k]) data[k] = [];
      if (!data[k].includes(typeId)) data[k].push(typeId);
    });
    recordHistory('add', typeId, targets);
  } else if (action === 'remove') {
    targets.forEach(k => {
      if (!data[k]) return;
      data[k] = data[k].filter(t => t !== typeId);
      if (!data[k].length) delete data[k];
    });
    recordHistory('remove', typeId, targets);
  } else if (action === 'clear') {
    targets.forEach(k => { delete data[k]; });
    recordHistory('clear', null, targets);
  }

  saveData();
  selectedDays.clear();
  renderCalendar();
  hideCtxMenu();
});

document.addEventListener('click', e => { if (!ctxMenu.contains(e.target)) hideCtxMenu(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideCtxMenu(); });
document.addEventListener('scroll', hideCtxMenu, true);

// ══════════════════════════════════════════════════
//  CALENDAR RENDER
// ══════════════════════════════════════════════════

function renderCalendar() {
  const title = document.getElementById('calTitle');
  const grid  = document.getElementById('calGrid');

  title.textContent = new Date(curYear, curMonth, 1)
    .toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
  grid.innerHTML = '';

  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d => {
    const el = document.createElement('div');
    el.className = 'cal-dow';
    el.textContent = d;
    grid.appendChild(el);
  });

  const firstDay    = new Date(curYear, curMonth, 1).getDay();
  const daysInMonth = new Date(curYear, curMonth+1, 0).getDate();
  const prevDays    = new Date(curYear, curMonth, 0).getDate();

  for (let i = 0; i < firstDay; i++) {
    const d = prevDays - firstDay + i + 1;
    const [pm, py] = curMonth === 0 ? [11, curYear-1] : [curMonth-1, curYear];
    grid.appendChild(makeDay(py, pm, d, true));
  }
  for (let d = 1; d <= daysInMonth; d++) {
    grid.appendChild(makeDay(curYear, curMonth, d, false));
  }
  const total = firstDay + daysInMonth;
  const remaining = total % 7 === 0 ? 0 : 7 - (total % 7);
  const [nm, ny] = curMonth === 11 ? [0, curYear+1] : [curMonth+1, curYear];
  for (let d = 1; d <= remaining; d++) {
    grid.appendChild(makeDay(ny, nm, d, true));
  }

  updateSelUI();
}

function makeDay(y, m, d, otherMonth) {
  const el = document.createElement('div');
  const key = dateKey(y, m, d);
  const isToday = y === today.getFullYear() && m === today.getMonth() && d === today.getDate();

  el.className = 'cal-day' +
    (otherMonth        ? ' other-month' : '') +
    (isToday           ? ' today'       : '') +
    (selectedDays.has(key) ? ' selected' : '');
  el.dataset.key = key;

  const numEl = document.createElement('div');
  numEl.className = 'day-num';
  numEl.textContent = d;
  el.appendChild(numEl);

  const types = data[key] || [];
  if (types.length) {
    const chips = document.createElement('div');
    chips.className = 'day-chips';
    types.forEach(tid => {
      const t = typeById(tid);
      if (!t) return;
      const c = document.createElement('div');
      c.className = 'chip';
      c.style.background = t.color;
      c.style.boxShadow = `0 0 4px ${t.color}99`;
      chips.appendChild(c);
    });
    el.appendChild(chips);
  }

  el.addEventListener('contextmenu', e => {
    e.preventDefault();
    showCtxMenu(key, e.clientX, e.clientY);
  });
  el.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    e.preventDefault();
    dragStart = key; dragging = true;
    dragMode  = selectedDays.has(key) ? 'remove' : 'add';
    toggleSelect(key, dragMode);
  });
  el.addEventListener('mouseover', () => { if (dragging) toggleSelect(key, dragMode); });
  el.addEventListener('touchstart', e => {
    clearTimeout(longPressTimer);
    const touch = e.touches[0];
    longPressTimer = setTimeout(() => { showCtxMenu(key, touch.clientX, touch.clientY); }, 500);
    dragStart = key; dragging = true;
    dragMode  = selectedDays.has(key) ? 'remove' : 'add';
    toggleSelect(key, dragMode);
  }, { passive: true });
  el.addEventListener('touchend',  () => { clearTimeout(longPressTimer); }, { passive: true });
  el.addEventListener('touchmove', () => { clearTimeout(longPressTimer); }, { passive: true });

  return el;
}

function toggleSelect(key, mode) {
  if (mode === 'add') selectedDays.add(key);
  else selectedDays.delete(key);
  const el = document.querySelector(`.cal-day[data-key="${key}"]`);
  if (el) el.classList.toggle('selected', mode === 'add');
  updateSelUI();
}

document.addEventListener('mouseup',  () => { dragging = false; dragStart = null; });
document.addEventListener('touchend', () => { dragging = false; dragStart = null; });

function updateSelUI() {
  const n = selectedDays.size;
  document.getElementById('selCount').textContent  = n;
  document.getElementById('selPlural').textContent = n === 1 ? '' : 's';
}

// ══════════════════════════════════════════════════
//  LEGEND
// ══════════════════════════════════════════════════

function renderLegend() {
  const el = document.getElementById('legend');
  el.innerHTML = '';
  TYPES.forEach(t => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<div class="legend-dot" style="background:${t.color};box-shadow:0 0 4px ${t.color}88"></div>${t.emoji} ${t.label}`;
    el.appendChild(item);
  });
}

// ══════════════════════════════════════════════════
//  REPORT
// ══════════════════════════════════════════════════

function renderReport() {
  const grid     = document.getElementById('reportGrid');
  grid.innerHTML = '';

  const selYear  = parseInt(document.getElementById('reportYear').value);
  const selMonth = document.getElementById('reportMonth').value;

  const allKeys = Object.keys(data).filter(k => {
    const { y, m } = parseKey(k);
    if (y !== selYear) return false;
    if (selMonth !== 'all' && m !== parseInt(selMonth)) return false;
    return true;
  });

  let anyData = false;

  TYPES.forEach(t => {
    const keys = allKeys.filter(k => (data[k] || []).includes(t.id));
    if (!keys.length) return;
    anyData = true;

    const periods = contiguousPeriods(keys);
    const card    = document.createElement('div');
    card.className = 'report-card';

    const periodsHtml = periods.map(([s, e]) => {
      const days = Math.round((new Date(e.replace(/-/g,'/')+' 00:00') - new Date(s.replace(/-/g,'/')+' 00:00')) / 86400000) + 1;
      const range = s === e ? fmtDate(s) : `${fmtDate(s)} – ${fmtDate(e)}`;
      return `<div class="rc-period-row">${range}<span>${days}d</span></div>`;
    }).join('');

    card.innerHTML = `
      <div class="rc-label">
        <div class="rc-dot" style="background:${t.color};box-shadow:0 0 4px ${t.color}88"></div>
        ${t.emoji} ${t.label}
      </div>
      <div class="rc-days" style="color:${t.color}">${keys.length}</div>
      <div class="rc-unit">day${keys.length !== 1 ? 's' : ''}</div>
      <div class="rc-periods">${periodsHtml}</div>`;
    grid.appendChild(card);
  });

  if (!anyData) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <div class="es-icon">📋</div>
      <p>No data for the selected period.<br>Add events on the Calendar tab.</p>
    </div>`;
  }
}

// ══════════════════════════════════════════════════
//  HISTORY
// ══════════════════════════════════════════════════

function renderHistory() {
  const list    = document.getElementById('histList');
  const userF   = document.getElementById('histUserFilter').value;
  const actionF = document.getElementById('histActionFilter').value;

  // Populate user filter (deduplicate)
  const filterEl  = document.getElementById('histUserFilter');
  const currentVal = filterEl.value;
  const users = [...new Set(history.map(h => h.username))];
  filterEl.innerHTML = '<option value="all">All users</option>';
  users.forEach(u => {
    const allUsers = getUsers();
    const display = (allUsers[u] || {}).displayName || u;
    filterEl.innerHTML += `<option value="${u}">${display}</option>`;
  });
  filterEl.value = currentVal;

  const filtered = history.filter(h => {
    if (userF !== 'all' && h.username !== userF) return false;
    if (actionF !== 'all' && h.action !== actionF) return false;
    return true;
  });

  if (!filtered.length) {
    list.innerHTML = `<div class="empty-state">
      <div class="es-icon">🕓</div>
      <p>No history yet.<br>Changes you make on the Calendar will appear here.</p>
    </div>`;
    return;
  }

  list.innerHTML = '';
  filtered.forEach(h => {
    const initials = (h.displayName || h.username).slice(0, 2).toUpperCase();
    const t = h.typeId ? typeById(h.typeId) : null;

    // Build action text
    let actionText = '';
    const dayCount = h.dayKeys.length;
    const dayLabel = dayCount === 1
      ? `<strong>${fmtDate(h.dayKeys[0])}</strong>`
      : `<strong>${dayCount} days</strong>`;

    if (h.action === 'add' && t) {
      actionText = `Added <span class="hist-type-chip" style="background:${t.color}">${t.emoji} ${t.label}</span> to ${dayLabel}`;
    } else if (h.action === 'remove' && t) {
      actionText = `Removed <span class="hist-type-chip" style="background:${t.color}">${t.emoji} ${t.label}</span> from ${dayLabel}`;
    } else if (h.action === 'clear') {
      actionText = `Cleared all types from ${dayLabel}`;
    }

    const badgeClass = h.action === 'add' ? 'hist-badge-add'
                     : h.action === 'remove' ? 'hist-badge-remove'
                     : 'hist-badge-clear';
    const badgeText = h.action === 'add' ? '+ add' : h.action === 'remove' ? '− remove' : '✕ clear';

    // Day keys preview (up to 5)
    const preview = h.dayKeys.slice(0, 5).map(k => {
      const {y,m,d} = parseKey(k);
      return new Date(y,m,d).toLocaleDateString(undefined,{month:'short',day:'numeric'});
    }).join(', ') + (h.dayKeys.length > 5 ? ` +${h.dayKeys.length - 5} more` : '');

    const entry = document.createElement('div');
    entry.className = 'hist-entry';
    entry.innerHTML = `
      <div class="hist-avatar" style="background:${h.userColor}">${initials}</div>
      <div class="hist-body">
        <div class="hist-action">${actionText}</div>
        <div class="hist-meta">${h.displayName} · ${preview}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
        <span class="${badgeClass}">${badgeText}</span>
        <span class="hist-time" title="${fmtDateTime(h.ts)}">${fmtRelative(h.ts)}</span>
      </div>`;
    list.appendChild(entry);
  });
}

document.getElementById('histUserFilter').addEventListener('change', renderHistory);
document.getElementById('histActionFilter').addEventListener('change', renderHistory);
document.getElementById('histClearBtn').addEventListener('click', () => {
  if (confirm('Clear all history? This cannot be undone.')) {
    history = [];
    saveHistory();
    renderHistory();
  }
});

// ══════════════════════════════════════════════════
//  TABS
// ══════════════════════════════════════════════════

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'report')  renderReport();
    if (btn.dataset.tab === 'history') renderHistory();
  });
});

// ══════════════════════════════════════════════════
//  WIRING
// ══════════════════════════════════════════════════

document.getElementById('prevMonth').addEventListener('click', () => {
  curMonth--; if (curMonth < 0) { curMonth = 11; curYear--; }
  renderCalendar();
});
document.getElementById('nextMonth').addEventListener('click', () => {
  curMonth++; if (curMonth > 11) { curMonth = 0; curYear++; }
  renderCalendar();
});
document.getElementById('clearSelBtn').addEventListener('click', () => {
  selectedDays.clear();
  document.querySelectorAll('.cal-day.selected').forEach(el => el.classList.remove('selected'));
  updateSelUI();
});
document.getElementById('resetBtn').addEventListener('click', resetData);
document.getElementById('reportYear').addEventListener('change', renderReport);
document.getElementById('reportMonth').addEventListener('change', renderReport);

// ══════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════

initSession();
</script>
